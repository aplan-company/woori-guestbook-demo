<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>송출 · 우리 새해 방명록</title>
<style>
  @font-face { font-family:"Wooridaum"; font-weight:700; src:url(assets/fonts/WooridaumB.woff2) format("woff2"); font-display:block; }
  @font-face { font-family:"Wooridaum"; font-weight:400; src:url(assets/fonts/WooridaumR.woff2) format("woff2"); font-display:block; }
  @font-face { font-family:"NanumPen"; src:url(assets/fonts/NanumPenScript.woff2) format("woff2"); font-display:block; }
  :root {
    --main1:#0067AC; --main2:#2482C5; --sub1:#253a71; --sub2:#123f6d; --sub3:#00aec6;
    --neon:#bdf0ff; --glow:#4cc3ff; --gold:#e8c66a; --heart:#ff6fa8;
  }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none;
    font-family:"Wooridaum","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; display:flex; }
  #fx { position:absolute; left:0; top:0; pointer-events:none; z-index:5; }

  /* ---------- 패널 (1080×1920 기준 좌표) ---------- */
  .panel { position:relative; overflow:hidden; color:#fff; background:#02050b; }
  .inner { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(140% 38% at 50% 106%, rgba(110,200,255,.55) 0%, rgba(36,130,197,.45) 22%, rgba(0,103,172,.18) 48%, transparent 70%),
      radial-gradient(90% 40% at 50% 0%, rgba(37,58,113,.55), transparent 70%),
      linear-gradient(180deg, #02050b 0%, #040b18 55%, #071a33 100%); }
  /* 우리금융 디자인 모티프: 숫자 '1'의 사선 띠 */
  .bg::before { content:""; position:absolute; left:-30%; top:-10%; width:160%; height:120%;
    background: linear-gradient(118deg, transparent 38%, rgba(36,130,197,.10) 38%, rgba(36,130,197,.10) 58%, transparent 58%);
    animation: band 14s ease-in-out infinite alternate; }
  @keyframes band { to { transform: translateX(6%); } }
  /* 여명 수평선 */
  .bg::after { content:""; position:absolute; left:-20%; right:-20%; top:1690px; height:600px; border-radius:50%;
    border-top:3px solid rgba(190,235,255,.55); box-shadow: 0 -14px 60px rgba(120,210,255,.45), inset 0 20px 80px rgba(0,103,172,.5);
    background: linear-gradient(180deg, rgba(0,103,172,.55), #02101f 40%); }

  .pill { position:absolute; left:64px; top:84px; padding:16px 34px 18px; border-radius:999px; font-size:40px; font-weight:700; letter-spacing:.02em;
    border:3px solid var(--neon); color:#fff;
    box-shadow: 0 0 10px var(--glow), 0 0 28px rgba(76,195,255,.6), inset 0 0 14px rgba(76,195,255,.45);
    text-shadow: 0 0 10px rgba(76,195,255,.9); background:rgba(4,20,40,.45); }
  .year { position:absolute; right:64px; top:58px; font-size:118px; font-weight:700; letter-spacing:-.02em; line-height:1;
    background: linear-gradient(105deg, #8c6b26 0%, #f7e4a4 18%, #c69b3e 32%, #fff6d2 46%, #b48a34 60%, #f1d68a 78%, #8c6b26 100%);
    background-size: 220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 14px rgba(232,198,106,.45)); animation: shine 6s linear infinite; }
  @keyframes shine { to { background-position: -220% 0; } }

  /* 네온 액자 */
  .frame { position:absolute; left:100px; top:250px; width:880px; height:1180px; border-radius:60px; overflow:hidden;
    border:8px solid var(--neon); background:rgba(3,14,30,.55);
    box-shadow: 0 0 14px var(--glow), 0 0 44px var(--main2), 0 0 110px rgba(0,174,198,.55), inset 0 0 36px rgba(76,195,255,.55);
    animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 10px var(--glow), 0 0 30px var(--main2), 0 0 70px rgba(0,174,198,.35), inset 0 0 26px rgba(76,195,255,.4); } }
  .panel.live .frame { animation: flicker .9s steps(1) 1, breathe 3.6s ease-in-out .9s infinite; }
  @keyframes flicker { 0%{opacity:1} 8%{opacity:.25} 14%{opacity:1} 22%{opacity:.4} 30%{opacity:1} 100%{opacity:1} }
  .frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:0; transition:opacity .9s .15s; }
  .panel.live .frame video { opacity:1; }
  .frame::after { content:""; position:absolute; inset:-20%; pointer-events:none; opacity:0;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%); transform: translateX(-80%); }
  .panel.live .frame::after { animation: sweep 1.4s .3s ease-out 1; }
  @keyframes sweep { 0%{opacity:1; transform:translateX(-80%)} 100%{opacity:1; transform:translateX(80%)} }

  /* 대기 화면 (QR) */
  .idle { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:opacity .7s; }
  .panel.live .idle { opacity:0; }
  .idle .k { font-size:30px; letter-spacing:.32em; color:#9fdcff; font-weight:400; }
  .idle .t1 { font-size:86px; font-weight:700; line-height:1.18; margin:22px 0 46px; text-shadow:0 0 30px rgba(76,195,255,.5); }
  .qr { width:400px; height:400px; padding:26px; box-sizing:border-box; background:#fff; border-radius:40px;
    box-shadow: 0 0 0 6px rgba(189,240,255,.9), 0 0 50px rgba(76,195,255,.8); }
  .qr svg, .qr img { width:100%; height:100%; display:block; }
  .idle .t2 { font-size:38px; color:#cfe6fb; margin-top:44px; line-height:1.5; font-weight:400; }
  .steps { display:flex; gap:18px; margin-top:34px; }
  .steps span { font-size:30px; padding:12px 24px; border-radius:999px; border:2px solid rgba(189,240,255,.55); color:#e6f6ff; }
  .steps b { color:var(--gold); margin-right:8px; }

  /* 손글씨 네온 메시지 */
  .msg { position:absolute; left:40px; width:1000px; top:1330px; height:300px; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .msg .w { display:inline-block; font-family:"NanumPen",cursive; color:#fff; line-height:.98; text-align:center; word-break:keep-all; max-width:960px;
    transform: rotate(-4deg);
    text-shadow: 0 0 4px #fff, 0 0 12px var(--glow), 0 0 26px var(--main2), 0 0 48px var(--main2), 0 6px 20px rgba(0,0,0,.6);
    clip-path: inset(-20% 102% -20% -2%); }
  .panel.live .msg .w { animation: write 1.6s .9s cubic-bezier(.5,.1,.4,1) forwards; }
  @keyframes write { to { clip-path: inset(-20% -6% -20% -2%); } }
  .heart { display:inline-block; vertical-align:-0.08em; margin-left:.12em; width:.8em; height:.8em; overflow:visible; }
  .heart path { fill:none; stroke:var(--heart); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:300; stroke-dashoffset:300;
    filter: drop-shadow(0 0 6px var(--heart)) drop-shadow(0 0 16px var(--heart)); }
  .panel.live .heart path { animation: draw 1s 2.5s ease-out forwards, beat 1.6s 3.5s ease-in-out infinite; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes beat { 50% { stroke-width:9; filter: drop-shadow(0 0 10px var(--heart)) drop-shadow(0 0 26px var(--heart)); } }

  /* 하단 브랜드: 「우리는 해」 + 우리금융그룹 CI */
  .brand { position:absolute; left:0; right:0; top:1650px; display:flex; flex-direction:column; align-items:center; }
  .slogan { display:flex; align-items:center; gap:22px; font-size:84px; font-weight:700; letter-spacing:-.01em; color:#fff;
    text-shadow: 0 0 22px rgba(120,210,255,.55); }
  .slogan .sun { position:relative; width:104px; height:104px; display:grid; place-items:center; }
  .slogan .sun img { position:absolute; inset:0; width:100%; height:100%; filter: drop-shadow(0 0 22px rgba(160,225,255,.9)); animation: rise 5s ease-in-out infinite; }
  .slogan .sun i { position:relative; top:8px; font-style:normal; font-size:60px; color:#0a4f8c; }
  @keyframes rise { 50% { transform: translateY(-6px) scale(1.04); } }
  .ci { height:46px; margin-top:34px; opacity:.95; }

  .msg { transition:opacity .6s; } .panel.out .msg, .panel.out .frame video { opacity:0; }
  #hud { position:fixed; left:10px; bottom:8px; color:#7fa; font:12px/1.4 monospace; background:#000a; padding:6px 10px; display:none; white-space:pre; z-index:9; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/qrcode.js"></script>
<script>
const ENDPOINT = ''; // ← Apps Script 웹 앱 URL (비워두면 로컬 데모 모드)
const SB_URL = 'https://jmsnadveqmduzprrevlb.supabase.co';  // Supabase 프로젝트 URL
const SB_KEY = 'sb_publishable_5tBAE0E6yw9PGkGmeXj0Yw_LMEVIMPw';  // 공개용(publishable) 키 — RLS로 보호되므로 코드에 넣어도 됨
// ===== 중간지점(Relay) 연결 — 세 파일 공통 =====
// ENDPOINT가 비어 있으면 '로컬 데모 모드'(같은 PC 같은 브라우저의 탭끼리 IndexedDB로 주고받음)
// 우선순위: ?api=(Apps Script) → Supabase(SB_URL·SB_KEY 설정 시) → 로컬 데모(localhost 또는 ?local)
const QS = new URLSearchParams(location.search);
const API = QS.get('api') || ENDPOINT;
const STAFF_KEY = QS.get('key') || '';   // 콘솔·송출 PC 전용 (승인·반려·송출 권한)
const LOCAL_OK = QS.has('local') || location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
const USE_SB = !API && !QS.has('local') && typeof SB_URL !== 'undefined' && SB_URL && SB_KEY && window.supabase;
const Relay = API ? gasRelay(API) : USE_SB ? supabaseRelay(SB_URL, SB_KEY, STAFF_KEY) : (LOCAL_OK ? localRelay() : null);
const RELAY_KEY = API || (USE_SB ? SB_URL : 'local'); // 접수 기록이 어느 중간지점 것인지 구분

function supabaseRelay(url, key, staffKey) {
  const sb = window.supabase.createClient(url, key, { auth: { persistSession: false } });
  const BUCKET = 'guestbook';
  const paths = new Map(); // id → 저장소 경로 (목록 조회 때 기억)
  const toItem = (r) => ({ id: r.id, createdAt: Date.parse(r.created_at), status: r.status, mime: r.mime,
    message: r.message || '', side: r.side || '' });
  const fail = (e, fallback) => { throw new Error((e && e.message) || fallback || '요청 실패'); };
  return {
    mode: 'supabase',
    async upload(blob, mime, message) {
      const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
      const path = 'v/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + ext;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: mime, upsert: false });
      if (up.error) fail(up.error, '업로드 실패');
      const ins = await sb.from('guestbook').insert({ path, mime, message: String(message || '').slice(0, 20) }).select('id').single();
      if (ins.error) { sb.storage.from(BUCKET).remove([path]); fail(ins.error, '접수 실패'); }
      return { ok: true, id: ins.data.id };
    },
    async list(status) {
      let q = sb.from('guestbook').select('*').order('created_at');
      if (status) q = q.in('status', String(status).split(','));
      const { data, error } = await q;
      if (error) fail(error);
      data.forEach(r => { if (r.path) paths.set(r.id, r.path); });
      return data.map(toItem);
    },
    async getFile(id) {
      let path = paths.get(id);
      if (!path) {
        const { data } = await sb.from('guestbook').select('path').eq('id', id).maybeSingle();
        path = data && data.path;
      }
      if (!path) throw new Error('파일 없음(이미 파기됨)');
      const r = await fetch(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl, { cache: 'no-store' });
      if (!r.ok) throw new Error('파일 없음(이미 파기됨)');
      return r.blob();
    },
    async setStatus(id, status, side = '') {
      const { data, error } = await sb.rpc('staff_set_status', { p_key: staffKey, p_id: id, p_status: status, p_side: side });
      if (error) fail(error);
      if (data) { paths.delete(id); await sb.storage.from(BUCKET).remove([data]); } // 즉시 파기
      return { ok: true };
    },
    async status(id) {
      const { data, error } = await sb.from('guestbook').select('id,status,side,created_at').eq('id', id).maybeSingle();
      if (error) fail(error);
      if (!data) throw new Error('없음');
      let position = 0;
      if (data.status === 'approved') {
        const c = await sb.from('guestbook').select('id', { count: 'exact', head: true })
          .eq('status', 'approved').lt('created_at', data.created_at);
        position = (c.count || 0) + 1;
      }
      return { ok: true, status: data.status, position, side: data.side };
    },
    // 새 접수·상태 변경이 생기면 즉시 호출 (폴링 대신)
    subscribe(cb) {
      sb.channel('guestbook-' + Math.random().toString(36).slice(2))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, () => cb())
        .subscribe();
      return true;
    },
  };
}

function gasRelay(url) {
  const timeoutFetch = (u, opt = {}, ms = 60000) => {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), ms);
    return fetch(u, { ...opt, signal: ac.signal }).finally(() => clearTimeout(t));
  };
  const get = async (params) => {
    const r = await timeoutFetch(url + '?' + new URLSearchParams(params));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '요청 실패');
    return j;
  };
  // Content-Type text/plain = 사전요청(preflight) 없는 단순 요청 → Apps Script와 호환
  const post = async (body) => {
    const r = await timeoutFetch(url, { method: 'POST', body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '요청 실패');
    return j;
  };
  return {
    mode: 'apps-script',
    async upload(blob, mime, message) {
      const data = await blobToBase64(blob);
      return post({ action: 'upload', mime, message, data });
    },
    async list(status) { return (await get({ action: 'list', status })).items; },
    async getFile(id) {
      const j = await get({ action: 'file', id });
      return (await fetch(`data:${j.mime};base64,${j.data}`)).blob();
    },
    setStatus(id, status, side = '') { return post({ action: 'setStatus', id, status, side }); },
    status(id) { return get({ action: 'status', id }); },
  };
}

function localRelay() {
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open('woori-guestbook-demo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const store = async (mode) => (await dbp).transaction('items', mode).objectStore('items');
  const all = async () => rq((await store('readonly')).getAll());
  return {
    mode: 'local',
    async upload(blob, mime, message) {
      const id = Math.random().toString(36).slice(2, 10);
      const now = Date.now();
      await rq((await store('readwrite')).put({ id, createdAt: now, status: 'pending', blob, mime, message: String(message || '').slice(0, 20), side: '', updatedAt: now }));
      return { ok: true, id };
    },
    async list(status) {
      return (await all()).filter(x => !status || String(status).split(',').includes(x.status))
        .sort((a, b) => a.createdAt - b.createdAt)
        .map(({ blob, ...rest }) => rest);
    },
    async getFile(id) {
      const it = await rq((await store('readonly')).get(id));
      if (!it || !it.blob) throw new Error('파일 없음(이미 파기됨)');
      return it.blob;
    },
    async setStatus(id, status, side = '') {
      const it = await rq((await store('readonly')).get(id));
      if (!it) return { ok: false };
      it.status = status; it.updatedAt = Date.now();
      if (side) it.side = side;
      if (status === 'rejected' || status === 'played') { delete it.blob; it.message = ''; } // 즉시 파기
      await rq((await store('readwrite')).put(it));
      return { ok: true };
    },
    async status(id) {
      const items = await all();
      const me = items.find(x => x.id === id);
      if (!me) throw new Error('없음');
      const position = me.status === 'approved'
        ? items.filter(x => x.status === 'approved' && x.createdAt < me.createdAt).length + 1 : 0;
      return { ok: true, status: me.status, position, side: me.side };
    },
  };
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}


if (!Relay) { document.body.innerHTML = '<p style="color:#fff;font:20px sans-serif;padding:40px">연결 정보가 없어요. 주소 뒤에 ?api=웹앱URL 을 붙여 열어주세요. (같은 PC 테스트는 ?local)</p>'; throw new Error('no relay'); }
// ===== 송출 설정 =====
const PANEL_W = 1080, PANEL_H = 1920;   // 벽 한 면 해상도 (MadMapper에서 좌/우로 잘라 매핑)
const SIDES = ['L', 'R'];               // 서예박물관 좌·우 외벽
const LOOPS = 2;                        // 한 영상 반복 횟수 (10초 × 2)
const POLL_MS = 1500;
const PRELOAD = 4;                      // 미리 받아둘 영상 수 (검수 대기 포함)

const stage = document.getElementById('stage');
const STAGE_W = PANEL_W * SIDES.length;
stage.style.width = STAGE_W + 'px';
stage.style.height = PANEL_H + 'px';
const S = PANEL_W / 1080; // 디자인 기준(1080×1920) 대비 배율

// 참여 페이지 주소 (QR) — 운영 키(key)는 빼고, Apps Script 모드면 api만 전달
const JOIN_URL = (() => {
  const u = new URL('mobile.html', location.href);
  u.search = ''; if (QS.get('api')) u.searchParams.set('api', QS.get('api'));
  if (QS.has('local')) u.searchParams.set('local', '');
  return u.href;
})();
function qrSvg(text) {
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}
const QR = qrSvg(JOIN_URL);
const HEART = '<svg class="heart" viewBox="0 0 100 92"><path d="M50 86 C22 64 6 48 6 28 C6 14 17 4 30 4 C40 4 47 10 50 18 C53 10 60 4 70 4 C83 4 94 14 94 28 C94 48 78 64 50 86 Z"/></svg>';

const panels = SIDES.map(side => {
  const el = document.createElement('div');
  el.className = 'panel';
  el.style.width = PANEL_W + 'px'; el.style.height = PANEL_H + 'px';
  el.innerHTML = `
  <div class="inner" style="transform:scale(${S})">
    <div class="bg"></div>
    <div class="pill">「우리 새해 방명록」</div>
    <div class="year">2027</div>
    <div class="frame">
      <video muted playsinline></video>
      <div class="idle">
        <div class="k">NEW YEAR GUESTBOOK</div>
        <div class="t1">새해 인사를<br>남겨주세요</div>
        <div class="qr">${QR}</div>
        <div class="t2">QR을 찍으면<br>이 벽에 내 영상이 나와요</div>
        <div class="steps"><span><b>1</b>QR 찍기</span><span><b>2</b>10초 셀피</span><span><b>3</b>외벽에 짠!</span></div>
      </div>
    </div>
    <div class="msg"><div class="w"></div></div>
    <div class="brand">
      <div class="slogan">우리는 <span class="sun"><img src="assets/yeomyeong.png" alt=""><i>해</i></span></div>
      <img class="ci" src="assets/ci_white.png" alt="우리금융그룹">
    </div>
  </div>`;
  stage.appendChild(el);
  return { side, el, video: el.querySelector('video'), msg: el.querySelector('.msg .w'), busy: false, item: null };
});

// 손글씨 메시지: 글자 수에 맞춰 크기 조절 (최대 2줄)
function setMessage(p, text) {
  const w = p.msg;
  w.innerHTML = '';
  if (!text) return;
  w.append(document.createTextNode(text));
  w.insertAdjacentHTML('beforeend', HEART);
  let size = 150;
  w.style.fontSize = size + 'px';
  while (size > 70 && (w.scrollWidth > 960 || w.offsetHeight > size * 0.98 * 2 + 4)) { size -= 6; w.style.fontSize = size + 'px'; }
}

function fit() {
  const sc = Math.min(innerWidth / STAGE_W, innerHeight / PANEL_H);
  stage.style.transform = `translate(${(innerWidth - STAGE_W * sc) / 2}px, ${(innerHeight - PANEL_H * sc) / 2}px) scale(${sc})`;
}
addEventListener('resize', fit); fit();

// ===== 반짝이 효과 (금빛 먼지 + 송출 시작 폭죽) =====
const fx = document.createElement('canvas');
fx.id = 'fx'; fx.width = STAGE_W; fx.height = PANEL_H; stage.appendChild(fx);
const ctx = fx.getContext('2d');
const dust = Array.from({ length: 110 }, () => ({
  x: Math.random() * STAGE_W, y: Math.random() * PANEL_H, r: (Math.random() * 2.4 + .6) * S,
  vy: -(Math.random() * .25 + .05) * S, ph: Math.random() * 6.28, gold: Math.random() < .55 }));
const sparks = [];
function burst(p) {
  const i = panels.indexOf(p), ox = i * PANEL_W, f = { x: ox + 100 * S, y: 250 * S, w: 880 * S, h: 1180 * S };
  for (let k = 0; k < 220; k++) {
    // 액자 테두리를 따라 터지는 불꽃
    const t = Math.random(), edge = k % 4;
    const x = edge === 0 ? f.x + t * f.w : edge === 1 ? f.x + f.w : edge === 2 ? f.x + t * f.w : f.x;
    const y = edge === 0 ? f.y : edge === 1 ? f.y + t * f.h : edge === 2 ? f.y + f.h : f.y + t * f.h;
    const a = Math.random() * 6.28, sp = (Math.random() * 6 + 2) * S;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: (Math.random() * 4 + 3) * S, gold: Math.random() < .6 });
  }
}
(function loop(t) {
  ctx.clearRect(0, 0, fx.width, fx.height);
  ctx.globalCompositeOperation = 'lighter';
  for (const d of dust) {
    d.y += d.vy; if (d.y < -10) { d.y = PANEL_H + 10; d.x = Math.random() * STAGE_W; }
    const a = .25 + .35 * (1 + Math.sin(t / 700 + d.ph)) / 2;
    ctx.fillStyle = d.gold ? `rgba(240,205,120,${a})` : `rgba(140,215,255,${a})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.28); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vx *= .96; s.vy = s.vy * .96 + .06 * S; s.life -= .012;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = s.gold ? `rgba(255,220,140,${s.life})` : `rgba(170,230,255,${s.life})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.5 + s.life / 2), 0, 6.28); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
})(0);

// ===== 대기열 =====
// 검수 대기(pending) 단계부터 영상을 미리 받아두고, 승인(approved)되면 바로 재생
const queue = [];          // 승인된 항목 {id, message}
const seen = new Set();    // 큐에 넣었거나 송출한 id
const ready = new Map();   // id → objectURL (미리 받은 영상)
const loading = new Set();
let pendingList = [];      // 아직 검수 중인 항목 (미리 받기 대상)
let paused = false, played = 0, lastErr = '';

let polling = false, pollAgain = false;
async function poll() {
  if (paused) return;
  if (polling) { pollAgain = true; return; }
  polling = true;
  try {
    const items = await Relay.list('pending,approved');
    const active = new Set(items.map(x => x.id));
    for (const it of items) if (it.status === 'approved' && !seen.has(it.id)) { seen.add(it.id); queue.push(it); }
    pendingList = items.filter(x => x.status === 'pending');
    // 반려되었거나 사라진 항목의 미리 받은 영상은 즉시 폐기
    for (const [id, url] of ready) if (!active.has(id) && !queue.some(q => q.id === id)) { URL.revokeObjectURL(url); ready.delete(id); }
    lastErr = '';
  } catch (e) { lastErr = e.message; }
  polling = false;
  preload();
  schedule();
  if (pollAgain) { pollAgain = false; poll(); }
}

async function preload() {
  const targets = [...queue, ...pendingList].slice(0, PRELOAD);
  for (const it of targets) {
    if (ready.has(it.id) || loading.has(it.id)) continue;
    loading.add(it.id);
    Relay.getFile(it.id).then(blob => {
      ready.set(it.id, URL.createObjectURL(blob));
      schedule();
    }).catch(e => { // 파일이 없으면(이미 파기 등) 건너뜀
      const qi = queue.findIndex(q => q.id === it.id); if (qi >= 0) queue.splice(qi, 1);
      lastErr = e.message;
    }).finally(() => loading.delete(it.id));
  }
}

function schedule() {
  if (paused) return;
  for (const p of panels) {
    if (p.busy) continue;
    const it = queue.find(x => ready.has(x.id));
    if (!it) return;
    queue.splice(queue.indexOf(it), 1);
    play(p, it);
  }
}

function play(p, it) {
  p.busy = true; p.item = it;
  const url = ready.get(it.id); ready.delete(it.id);
  let count = 0;
  setMessage(p, it.message || '');
  p.video.src = url;
  const start = () => p.video.play().catch(() => {});
  p.video.onloadeddata = () => { p.el.classList.add('live'); burst(p); start(); };
  p.video.onended = () => { count++; if (count < LOOPS) { p.video.currentTime = 0; start(); } else finish(); };
  const guard = setTimeout(finish, 15000 * LOOPS); // 재생 오류 대비 안전장치
  Relay.setStatus(it.id, 'playing', p.side).catch(() => {});
  let doneOnce = false;
  function finish() {
    if (doneOnce) return; doneOnce = true;
    clearTimeout(guard);
    p.el.classList.add('out');
    Relay.setStatus(it.id, 'played', p.side).catch(() => {}); // → 중간지점에서 즉시 파기
    played++;
    setTimeout(() => {
      p.el.classList.remove('live', 'out');
      p.video.removeAttribute('src'); p.video.load();
      URL.revokeObjectURL(url);
      p.busy = false; p.item = null;
      schedule();
    }, 900);
  }
  preload();
}

// ===== 단축키: F 전체화면 · D 상태표시 · P 일시정지(브랜딩 영상 구간 등) =====
const hud = document.getElementById('hud');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'd') hud.style.display = hud.style.display === 'block' ? 'none' : 'block';
  if (k === 'p') { paused = !paused; if (!paused) poll(); }
});
setInterval(() => {
  hud.textContent = `mode: ${Relay.mode}${paused ? '  [일시정지]' : ''}\nqueue: ${queue.length}  pending: ${pendingList.length}  ready: ${ready.size}  played: ${played}\n` +
    panels.map(p => `${p.side}: ${p.item ? '#' + p.item.id : '-'}`).join('  ') + (lastErr ? `\nerr: ${lastErr}` : '');
}, 500);

document.fonts && document.fonts.load('100px NanumPen'); // 손글씨 폰트 미리 받기
poll();
const live = Relay.subscribe ? Relay.subscribe(poll) : false; // 실시간 알림 지원 시 즉시 반영
setInterval(poll, live ? 5000 : POLL_MS);
</script>
</body>
</html>
