<style>

  /* 장면을 이끄는 도형 */
  .shape { position:absolute; z-index:1; left:300px; top:160px; width:480px; height:480px; border-radius:240px;

  .panel[data-form="capsule"] .shape { left:120px; top:320px; width:840px; height:260px; border-radius:130px; transform:none; }

  .dot2 { position:absolute; z-index:2; width:90px; height:90px; border-radius:45px; background:linear-gradient(135deg,#c9f4ff,#19c3ff); left:840px; top:560px;

  .panel[data-form="square"] .dot2 { left:740px; top:560px; }

  .panel[data-form="circle"] .dot2 { left:780px; top:140px; }

  .panel.live .shape { left:22px; top:22px; width:1036px; height:1876px; border-radius:84px; transform:none; }
  .panel.live .dot2 { left:968px; top:-12px; width:80px; height:80px; border-radius:40px; transform:none; }
  .panel.out .shape { left:510px; top:1612px; width:60px; height:60px; border-radius:30px; transform:none; transition-duration:.9s; transition-timing-function:cubic-bezier(.6,0,.3,1); }
  .panel.out .dot2 { opacity:0; }
  .frame { position:absolute; z-index:2; left:38px; top:38px; width:1004px; height:1844px; border-radius:68px; overflow:hidden; opacity:0; transition:opacity .8s; background:#0a1a33; }
  .frame::before { content:""; position:absolute; z-index:1; left:0; right:0; bottom:0; height:46%; pointer-events:none;
    background:linear-gradient(180deg, rgba(6,20,48,0) 0%, rgba(6,20,48,.45) 40%, rgba(6,20,48,.9) 64%, #061430 76%, #061430 100%); }

  .frame img { display:none; }
  .panel.isPhoto .frame img { display:block; animation: kb 11s ease-out forwards; } .panel.isPhoto .frame video { display:none; }
  @keyframes kb { from { transform:scaleX(-1) scale(1); } to { transform:scaleX(-1) scale(1.08); } }
  .frame::after { content:""; position:absolute; inset:-30%; pointer-events:none; opacity:0;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.6) 50%, transparent 58%); transform:translateX(-70%); }

  /* 대기 화면 */
  .idle { position:absolute; z-index:2; left:0; right:0; top:730px; display:flex; flex-direction:column; align-items:center; text-align:center; transition:opacity .6s, transform .8s var(--spring); }

  .label { font:600 26px/1 var(--mono); letter-spacing:.2em; color:var(--blue); }

  .ch { display:inline-block; opacity:0; transform:translateY(.55em) rotate(7deg); }
  .in .ch { animation: chIn .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i) * 30ms + 150ms); }
  @keyframes chIn { to { opacity:1; transform:none; } }
  .qr { width:400px; height:400px; padding:30px; box-sizing:border-box; background:#fff; border-radius:56px; box-shadow:0 0 0 2px var(--line), 0 30px 80px rgba(22,115,255,.18); }
  .qr svg { width:100%; height:100%; display:block; }
  .steps { display:flex; gap:16px; margin-top:42px; }
  .steps span { font-size:30px; padding:14px 26px; border-radius:999px; background:#fff; box-shadow:0 0 0 2px var(--line); }

  /* 손글씨 한마디: 글자마다 따로 움직임 */
  .msg { position:absolute; z-index:3; left:40px; width:1000px; top:1330px; height:300px; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .msg .w { font-family:"NanumPen",cursive; color:#0b3fb0; line-height:1; text-align:center; word-break:keep-all; max-width:960px;

  .msg .c { display:inline-block; opacity:0; transform:translateY(60%) scale(.4) rotate(var(--rot)); }
  .panel.live .msg .c { animation: cPop .6s cubic-bezier(.2,.9,.3,1.3) forwards, cFloat 2.6s ease-in-out infinite;

    box-shadow:0 0 calc(10px + var(--glow) * 60px) rgba(57,184,255, calc(.4 + var(--glow) * .5)); }
  .lights { position:absolute; z-index:2; left:60px; right:60px; top:1560px; height:80px; }
  .lights i { position:absolute; bottom:0; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--blue); box-shadow:0 0 14px rgba(22,115,255,.6); animation: lIn .8s var(--spring); }
  .lights i:nth-child(3n) { background:var(--cyan); } .lights i:nth-child(4n) { background:#8fe6ff; }
  @keyframes lIn { from { transform:translateY(-200px) scale(2.4); opacity:0; } }
  .count { position:absolute; z-index:2; right:64px; top:1670px; font:600 24px/1 var(--mono); letter-spacing:.16em; color:var(--muted); }
  .count b { color:var(--blue); }

  /* 하단 브랜드: 「우리는 해」 + 우리금융그룹 CI */
  .brand { position:absolute; z-index:2; left:0; right:0; top:1720px; display:flex; flex-direction:column; align-items:center; }
  .slogan { display:flex; align-items:center; gap:16px; font-size:56px; font-weight:700; letter-spacing:-.01em; }
  .slogan .sun { position:relative; width:76px; height:76px; display:grid; place-items:center; }
  .slogan .sun img { position:absolute; inset:0; width:100%; height:100%; }
  .slogan .sun i { position:relative; top:5px; font-style:normal; font-size:42px; color:#0a4f8c; }
  .cobrand { display:flex; align-items:center; gap:30px; margin-top:20px; }
  .ci { height:46px; } .ci.sac { height:50px; }
  .sep { width:2px; height:46px; background:var(--ink); opacity:.22; }
  .panel.live:not(.out) .sep { background:#fff; opacity:.5; }
  #hud { position:fixed; left:10px; bottom:8px; color:#7fa; font:12px/1.4 monospace; background:#000a; padding:6px 10px; display:none; white-space:pre; z-index:9; }
</style>

<body>
<div id="stage"></div>
<div id="hud"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/qrcode.js"></script>
<script>
const ENDPOINT = ''; // ← Apps Script 웹 앱 URL (비워두면 로컬 데모 모드)
const SB_URL = 'https://jmsnadveqmduzprrevlb.supabase.co';  // Supabase 프로젝트 URL
const SB_KEY = 'sb_publishable_5tBAE0E6yw9PGkGmeXj0Yw_LMEVIMPw';  // 공개용(publishable) 키 — RLS로 보호되므로 코드에 넣어도 됨
/*RELAY*/

if (!Relay) { document.body.innerHTML = '<p style="color:#fff;font:20px sans-serif;padding:40px">연결 정보가 없어요. 주소 뒤에 ?api=웹앱URL 을 붙여 열어주세요. (같은 PC 테스트는 ?local)</p>'; throw new Error('no relay'); }
// ===== 송출 설정 =====
const PANEL_W = 1080, PANEL_H = 1920;   // 벽 한 면 해상도 (MadMapper에서 좌/우로 잘라 매핑)
const SIDES = ['L', 'R'];               // 서예박물관 좌·우 외벽
const LOOPS = 2;                        // 한 영상 반복 횟수 (5초 × 2 = 약 10초)
const PHOTO_MS = 10000;                 // 사진 표시 시간
const POLL_MS = 1500;
const PRELOAD = 4;                      // 미리 받아둘 영상 수 (검수 대기 포함)

const stage = document.getElementById('stage');
const STAGE_W = PANEL_W * SIDES.length;
stage.style.width = STAGE_W + 'px';
stage.style.height = PANEL_H + 'px';
const S = PANEL_W / 1080; // 디자인 기준(1080×1920) 대비 배율

// 참여 페이지 주소 (QR) — 운영 키(key)는 빼고, Apps Script 모드면 api만 전달
const JOIN_URL = (() => {
  const u = new URL('mobile.html', location.href);
  u.search = ''; if (QS.get('api')) u.searchParams.set('api', QS.get('api'));
  if (QS.has('local')) u.searchParams.set('local', '');
  return u.href;
})();
function qrSvg(text) {
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}
const QR = qrSvg(JOIN_URL);

const FORMS = ['semi', 'square', 'capsule', 'circle'];
const LS_KEY = 'woori-gb-lights';
let lights = +(localStorage.getItem(LS_KEY) || 0);
function splitChars(el, cls = 'ch') {
  let i = 0;
  const walk = (node) => [...node.childNodes].forEach(n => {
    if (n.nodeType === 3) { const f = document.createDocumentFragment();
      [...n.textContent].forEach(c => { if (c === ' ') { f.append(' '); return; } const sp = document.createElement('span'); sp.className = cls; sp.style.setProperty('--i', i++);
        sp.style.setProperty('--rot', ((Math.random() - .5) * 14).toFixed(1) + 'deg'); sp.textContent = c; f.append(sp); });
      n.replaceWith(f); }
    else if (n.nodeType === 1 && n.tagName !== 'BR') walk(n);
  });
  walk(el);
}
const panels = SIDES.map((side, idx) => {
  const el = document.createElement('div');
  el.className = 'panel';
  el.style.width = PANEL_W + 'px'; el.style.height = PANEL_H + 'px';
  el.innerHTML = `
  <div class="inner" style="transform:scale(${S})">
    <div class="bg"></div>
    <div class="shape"></div><div class="dot2"></div>
    <div class="pill">「우리 새해 방명록」</div>
    <div class="tag">LIGHT GUESTBOOK · ${side}</div>
    <div class="frame"><video muted playsinline></video><img alt=""></div>
    <div class="idle">
      <div class="label">NEW YEAR · LIGHT GUESTBOOK</div>
      <div class="t1">QR을 찍고<br>새해의 첫 빛이 되어주세요</div>
      <div class="qr">${QR}</div>
      <div class="steps"><span><b>1</b>한마디 쓰기</span><span><b>2</b>셀피 찍기</span><span><b>3</b>외벽에 빛나기</span></div>
    </div>
    <div class="msg"><div class="w"></div></div>
    <div class="lights"></div>
    <div class="horizon"></div>
    <div class="count">LIGHTS TONIGHT <b>0000</b></div>
    <div class="brand">
      <div class="slogan">2027 새해, 우리는 <span class="sun"><img src="assets/yeomyeong.png" alt=""><i>해</i></span></div>
      <div class="cobrand"><img class="ci b" src="assets/ci_blue.png" alt="우리금융그룹"><img class="ci w" src="assets/ci_white.png" alt=""><i class="sep"></i><img class="ci b sac" src="assets/sac_color.png" alt="예술의전당"><img class="ci w sac" src="assets/sac_white.png" alt=""></div>
    </div>
  </div>`;
  stage.appendChild(el);
  const p = { side, el, img: el.querySelector('.frame img'), video: el.querySelector('video'), msg: el.querySelector('.msg .w'), idle: el.querySelector('.idle'), busy: false, item: null, form: idx, softT: 0 };
  splitChars(el.querySelector('.t1'));
  setForm(p, FORMS[idx * 2 % FORMS.length]);
  return p;
});
// 2D 도형으로 먼저 리드 → 잠시 뒤 그라데이션으로
function soften(p, ms = 900) { p.el.classList.remove('soft'); clearTimeout(p.softT); p.softT = setTimeout(() => p.el.classList.add('soft'), ms); }
function setForm(p, f) { p.el.dataset.form = f; soften(p); }
function replayIdleText(p) { p.idle.classList.remove('in'); void p.idle.offsetWidth; p.idle.classList.add('in'); }
panels.forEach(replayIdleText);
setInterval(() => panels.forEach((p) => { if (p.busy) return; p.form = (p.form + 1) % FORMS.length; setForm(p, FORMS[p.form]); }), 5200);

// 한마디: 글자 수에 맞춰 크기 조절 (최대 2줄) + 글자별 애니메이션
function setMessage(p, text) {
  const w = p.msg; w.innerHTML = '';
  if (!text) return;
  // 단어는 줄바꿈 없이 묶고, 그 안에서 글자마다 따로 움직임
  let k = 0;
  text.split(' ').forEach((word, wi) => {
    if (wi) w.append(' ');
    const ws = document.createElement('span'); ws.style.whiteSpace = 'nowrap'; ws.style.display = 'inline-block';
    [...word].forEach(c => { const sp = document.createElement('span'); sp.className = 'c'; sp.style.setProperty('--i', k++); sp.style.setProperty('--rot', ((Math.random() - .5) * 14).toFixed(1) + 'deg'); sp.textContent = c; ws.append(sp); });
    w.append(ws);
  }); w.lastChild && w.lastChild.insertAdjacentHTML('beforeend', '<span class="c star" style="--i:' + k + ';--rot:0deg"></span>');
  let size = 150; w.style.fontSize = size + 'px';
  while (size > 70 && (w.scrollWidth > 960 || w.offsetHeight > size * 2 + 6)) { size -= 6; w.style.fontSize = size + 'px'; }
}
// 모인 빛: 한 편이 끝날 때마다 수평선 위에 빛이 하나씩 쌓임
function renderLights(newOne) {
  panels.forEach(p => {
    const box = p.el.querySelector('.lights');
    const show = Math.min(lights, 70);
    while (box.children.length > show) box.firstChild.remove();
    while (box.children.length < show) { const d = document.createElement('i'); d.style.left = (4 + Math.random() * 92) + '%'; d.style.bottom = (Math.random() * 46) + 'px';
      if (!newOne) d.style.animation = 'none'; box.append(d); }
    p.el.querySelector('.count b').textContent = String(lights).padStart(4, '0');
    p.el.querySelector('.horizon').style.setProperty('--glow', Math.min(1, lights / 300).toFixed(3));
  });
}
function addLight() { lights++; try { localStorage.setItem(LS_KEY, lights); } catch (e) {} renderLights(true); }
renderLights(false);

function fit() {
  const sc = Math.min(innerWidth / STAGE_W, innerHeight / PANEL_H);
  stage.style.transform = `translate(${(innerWidth - STAGE_W * sc) / 2}px, ${(innerHeight - PANEL_H * sc) / 2}px) scale(${sc})`;
}
addEventListener('resize', fit); fit();

// ===== 빛 입자 (천천히 떠오르는 빛 + 송출 시작 반짝임) =====
const fx = document.createElement('canvas');
fx.id = 'fx'; fx.width = STAGE_W; fx.height = PANEL_H; stage.appendChild(fx);
const ctx = fx.getContext('2d');
const dust = Array.from({ length: 90 }, () => ({
  x: Math.random() * STAGE_W, y: Math.random() * PANEL_H, r: (Math.random() * 4 + 2) * S,
  vy: -(Math.random() * .5 + .15) * S, ph: Math.random() * 6.28, c: Math.random() < .5 ? '22,115,255' : '25,195,255' }));
const sparks = [];
function burst(p) {
  const i = panels.indexOf(p), ox = i * PANEL_W, f = { x: ox + 22 * S, y: 22 * S, w: 1036 * S, h: 1876 * S };
  for (let k = 0; k < 200; k++) {
    const t = Math.random(), edge = k % 4;
    const x = edge === 0 ? f.x + t * f.w : edge === 1 ? f.x + f.w : edge === 2 ? f.x + t * f.w : f.x;
    const y = edge === 0 ? f.y : edge === 1 ? f.y + t * f.h : edge === 2 ? f.y + f.h : f.y + t * f.h;
    const a = Math.random() * 6.28, sp = (Math.random() * 7 + 2) * S;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: (Math.random() * 5 + 3) * S, c: Math.random() < .5 ? '22,115,255' : '57,184,255' });
  }
}
(function loop(t) {
  ctx.clearRect(0, 0, fx.width, fx.height);
  for (const d of dust) {
    d.y += d.vy; if (d.y < -10) { d.y = PANEL_H + 10; d.x = Math.random() * STAGE_W; }
    const a = .15 + .25 * (1 + Math.sin(t / 800 + d.ph)) / 2;
    ctx.fillStyle = `rgba(${d.c},${a})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.28); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vx *= .95; s.vy *= .95; s.life -= .014;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(${s.c},${s.life})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + s.life * .6), 0, 6.28); ctx.fill();
  }
  requestAnimationFrame(loop);
})(0);

// ===== 대기열 =====
// 검수 대기(pending) 단계부터 영상을 미리 받아두고, 승인(approved)되면 바로 재생
const queue = [];          // 승인된 항목 {id, message}
const seen = new Set();    // 큐에 넣었거나 송출한 id
const ready = new Map();   // id → objectURL (미리 받은 영상)
const loading = new Set();
let pendingList = [];      // 아직 검수 중인 항목 (미리 받기 대상)
let paused = false, played = 0, lastErr = '';
let reviewOff = false;     // 검수 OFF: 접수 즉시 송출 대기열로
const autoOk = new Set();

let polling = false, pollAgain = false;
async function poll() {
  if (paused) return;
  if (polling) { pollAgain = true; return; }
  polling = true;
  try {
    const items = await Relay.list('pending,approved');
    const active = new Set(items.map(x => x.id));
    for (const it of items) {
      if (it.status === 'pending' && reviewOff && !autoOk.has(it.id)) { autoOk.add(it.id); it.status = 'approved'; Relay.setStatus(it.id, 'approved').catch(() => autoOk.delete(it.id)); }
      if (it.status === 'approved' && !seen.has(it.id)) { seen.add(it.id); queue.push(it); }
    }
    pendingList = items.filter(x => x.status === 'pending');
    // 반려되었거나 사라진 항목의 미리 받은 영상은 즉시 폐기
    for (const [id, url] of ready) if (!active.has(id) && !queue.some(q => q.id === id)) { URL.revokeObjectURL(url); ready.delete(id); }
    lastErr = '';
  } catch (e) { lastErr = e.message; }
  polling = false;
  preload();
  schedule();
  if (pollAgain) { pollAgain = false; poll(); }
}

async function preload() {
  const targets = [...queue, ...pendingList].slice(0, PRELOAD);
  for (const it of targets) {
    if (ready.has(it.id) || loading.has(it.id)) continue;
    loading.add(it.id);
    Relay.getFile(it.id).then(blob => {
      ready.set(it.id, URL.createObjectURL(blob));
      schedule();
    }).catch(e => { // 파일이 없으면(이미 파기 등) 건너뜀
      const qi = queue.findIndex(q => q.id === it.id); if (qi >= 0) queue.splice(qi, 1);
      lastErr = e.message;
    }).finally(() => loading.delete(it.id));
  }
}

function schedule() {
  if (paused) return;
  for (const p of panels) {
    if (p.busy) continue;
    const it = queue.find(x => ready.has(x.id));
    if (!it) return;
    queue.splice(queue.indexOf(it), 1);
    play(p, it);
  }
}

function play(p, it) {
  p.busy = true; p.item = it;
  const url = ready.get(it.id); ready.delete(it.id);
  let count = 0;
  setMessage(p, it.message || '');
  const isPhoto = String(it.mime || '').startsWith('image');
  const goLive = () => { p.el.classList.add('live'); soften(p, 800); setTimeout(() => burst(p), 900); };
  let guard;
  if (isPhoto) { // 사진: 천천히 다가가는 연출로 일정 시간 표시
    p.el.classList.add('isPhoto');
    p.img.onload = () => { goLive(); clearTimeout(guard); guard = setTimeout(finish, PHOTO_MS); };
    p.img.onerror = () => finish();
    p.img.src = url;
    guard = setTimeout(finish, PHOTO_MS + 5000);
  } else {
    p.el.classList.remove('isPhoto');
    p.video.src = url;
    const start = () => p.video.play().catch(() => {});
    p.video.onloadeddata = () => { goLive(); start(); };
    p.video.onended = () => { count++; if (count < LOOPS) { p.video.currentTime = 0; start(); } else finish(); };
    guard = setTimeout(finish, 15000 * LOOPS); // 재생 오류 대비 안전장치
  }
  Relay.setStatus(it.id, 'playing', p.side).catch(() => {});
  let doneOnce = false;
  function finish() {
    if (doneOnce) return; doneOnce = true;
    clearTimeout(guard);
    p.el.classList.add('out'); p.el.classList.remove('soft');
    Relay.setStatus(it.id, 'played', p.side).catch(() => {}); // → 중간지점에서 즉시 파기
    played++;
    setTimeout(addLight, 900); // 도형이 빛 한 점으로 줄어 수평선에 합류
    setTimeout(() => {
      p.el.classList.remove('live', 'out', 'isPhoto'); setForm(p, FORMS[p.form]); replayIdleText(p);
      p.video.removeAttribute('src'); p.video.load(); p.img.removeAttribute('src');
      URL.revokeObjectURL(url);
      p.busy = false; p.item = null;
      schedule();
    }, 1300);
  }
  preload();
}

// ===== 단축키: F 전체화면 · D 상태표시 · P 일시정지(브랜딩 영상 구간 등) =====
const hud = document.getElementById('hud');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'd') hud.style.display = hud.style.display === 'block' ? 'none' : 'block';
  if (k === 'p') { paused = !paused; if (!paused) poll(); }
  if (k === 'r' && e.shiftKey) { lights = 0; try { localStorage.setItem(LS_KEY, 0); } catch (err) {} renderLights(false); } // Shift+R: 모인 빛 초기화
});
setInterval(() => {
  hud.textContent = `mode: ${Relay.mode}${paused ? '  [일시정지]' : ''}  lights: ${lights} (Shift+R 초기화)\nreview: ${reviewOff ? 'OFF(바로 송출)' : 'ON'}  queue: ${queue.length}  pending: ${pendingList.length}  ready: ${ready.size}  played: ${played}\n` +
    panels.map(p => `${p.side}: ${p.item ? '#' + p.item.id : '-'}`).join('  ') + (lastErr ? `\nerr: ${lastErr}` : '');
}, 500);

function applyReview(c) { const was = reviewOff; reviewOff = (c && c.review_mode) === 'off'; if (reviewOff && !was) poll(); }
Relay.getConfig && Relay.getConfig().then(applyReview).catch(() => {});
Relay.subscribeConfig && Relay.subscribeConfig(applyReview);
setInterval(() => Relay.getConfig && Relay.getConfig().then(applyReview).catch(() => {}), 15000);

document.fonts && document.fonts.load('100px NanumPen'); // 손글씨 폰트 미리 받기
poll();
const live = Relay.subscribe ? Relay.subscribe(poll) : false; // 실시간 알림 지원 시 즉시 반영
setInterval(poll, live ? 5000 : POLL_MS);
</script>
</body>
