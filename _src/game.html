<script>

  if (QS.has('local')) u.searchParams.set('local', '');

})();
function qrSvg(text) {
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}
const QR = qrSvg(JOIN_URL);

const FORMS = ['semi', 'square', 'capsule', 'circle'];
const LS_KEY = 'woori-gb-lights';
let lights = +(localStorage.getItem(LS_KEY) || 0);
function splitChars(el, cls = 'ch') {
  let i = 0;
  const walk = (node) => [...node.childNodes].forEach(n => {
    if (n.nodeType === 3) { const f = document.createDocumentFragment();
      [...n.textContent].forEach(c => { if (c === ' ') { f.append(' '); return; } const sp = document.createElement('span'); sp.className = cls; sp.style.setProperty('--i', i++);
        sp.style.setProperty('--rot', ((Math.random() - .5) * 14).toFixed(1) + 'deg'); sp.textContent = c; f.append(sp); });

    else if (n.nodeType === 1 && n.tagName !== 'BR') walk(n);
  });
  walk(el);
}
const panels = SIDES.map((side, idx) => {

  el.className = 'panel';

        <div class="steps"><span><b>1</b>한마디</span><span><b>2</b>셀피 5초</span><span><b>3</b>1~2분 뒤 이 벽에</span></div>
      </div>
      <div class="scene sc-clock" data-s="clock">
        <div class="label clkLabel">NOW · 지금 시각</div>
        <div class="clk"><span class="hh">00</span><i>:</i><span class="mm">00</span><small class="date">2026. 12. 31 WED</small></div>
        <div class="rule"></div>
        <div class="left1">2027년까지</div>
        <div class="left2">-</div>
        <div class="left3">새해 인사, 지금 남겨 주세요</div>
      </div>
      <div class="scene sc-how" data-s="how">
        <div class="label">HOW TO · 참여 방법</div>
        <div class="t1 sp" style="margin:22px 0 40px">이렇게 참여해요</div>
        <div class="rows">
          <div class="row" style="--r:0"><div class="n">1</div><div><b>광장 QR을 찍어요</b><span>앱 설치 없이 바로 열려요</span></div></div>
          <div class="row" style="--r:1"><div class="n">2</div><div><b>한마디 + 셀피 5초</b><span>영상이 어려우면 사진도 OK</span></div></div>
          <div class="row" style="--r:2"><div class="n">3</div><div><b>1~2분 뒤 이 벽에</b><span>확인 후 약 10초간 크게 나와요</span></div></div>
        </div>
        <div class="howq"><div class="qr">${QR}</div>지금 바로<br>찍어 보세요</div>
      </div>
      <div class="scene sc-frame" data-s="frame">
        <div class="label">NEXT ON THIS WALL</div>
        <div class="ghost"><em></em></div>
        <div class="t1 sp">다음 주인공은<br>바로 당신</div>
        <div class="eta">지금 찍으면 <b class="etaN">약 1분</b> 뒤 이 자리에</div>
      </div>
    </div>
    <div class="msg"><div class="w"></div></div>
    <div class="lights"></div>
    <div class="horizon"></div>
    <div class="count">LIGHTS TONIGHT <b>0000</b></div>
    <div class="brand">
      <div class="slogan">2027 새해, 우리는 해</div>
      <div class="cobrand"><img class="ci b" src="assets/ci_blue.png" alt="우리금융그룹"><img class="ci w" src="assets/ci_white.png" alt=""><i class="sep"></i><img class="ci b sac" src="assets/sac_color.png" alt="예술의전당"><img class="ci w sac" src="assets/sac_white.png" alt=""></div>
    </div>
  </div>`;
  stage.appendChild(el);
  const p = { side, el, img: el.querySelector('.frame img'), video: el.querySelector('video'), msg: el.querySelector('.msg .w'), idle: el.querySelector('.idle'), busy: false, item: null, form: idx, softT: 0,
    scenes: [...el.querySelectorAll('.scene')], sc: idx - 1, scT: 0 };
  el.querySelectorAll('.sp').forEach(t => splitChars(t));
  return p;
});
// 2D 도형으로 먼저 리드 → 잠시 뒤 그라데이션으로
function soften(p, ms = 900) { p.el.classList.remove('soft'); clearTimeout(p.softT); p.softT = setTimeout(() => p.el.classList.add('soft'), ms); }
function setForm(p, f) { p.el.dataset.form = f; soften(p); }
// ===== 대기 시퀀스 =====
// 장면 순서 · 길이 · 도형. 좌·우 벽은 한 장면씩 엇갈려 시작 → 늘 다른 장면 (어느 한쪽엔 QR)
const SCENES = [
  { id: 'join',  ms: 8000, form: ['semi', 'circle'] },
  { id: 'clock', ms: 8000, form: ['full', 'full'] },
  { id: 'how',   ms: 9000, form: ['pill', 'capsule'] },
  { id: 'frame', ms: 7000, form: ['frame', 'frame'] },
];
function showScene(p, i) {
  p.sc = (i + SCENES.length) % SCENES.length; const S0 = SCENES[p.sc], idx = panels.indexOf(p);
  setForm(p, S0.form[idx % 2]);
  p.scenes.forEach(el => { const on = el.dataset.s === S0.id; el.classList.toggle('on', on); el.classList.remove('in'); if (on) { void el.offsetWidth; el.classList.add('in'); } });
  clearTimeout(p.scT); p.scT = setTimeout(() => { if (!p.busy) showScene(p, p.sc + 1); }, S0.ms);
}
function replayIdleText(p) { showScene(p, p.sc + 1); } // 송출이 끝나면 다음 장면부터 이어서
// 시계 · 남은 시간 (기본: 2027-01-01 00:00 KST, 테스트는 ?target=2026-11-18T16:00:00+09:00)
const TARGET = new Date(QS.get('target') || '2027-01-01T00:00:00+09:00').getTime();
const pad2 = n => String(n).padStart(2, '0');
function tickClock() {
  const now = new Date(), kst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000), diff = TARGET - now.getTime();
  const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  let label, l1, l2, l3;
  if (diff > 0) {
    const t = Math.ceil(diff / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    label = 'NOW · 지금 시각'; l1 = '2027년까지';
    l2 = h >= 24 ? `${Math.floor(h / 24)}<small>일</small>${h % 24}<small>시간</small>` : h > 0 ? `${h}<small>시간</small>${pad2(m)}<small>분</small>` : `${m}<small>분</small>${pad2(s)}<small>초</small>`;
    l3 = h === 0 && m < 1 ? '곧 새해예요! 함께 외쳐요' : '새해 인사, 지금 남겨 주세요';
  } else {
    const t = Math.floor(-diff / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    label = 'HAPPY NEW YEAR 2027'; l1 = '2027년이 밝은 지';
    l2 = h > 0 ? `${h}<small>시간</small>${pad2(m)}<small>분</small>` : `${m}<small>분</small>${pad2(s)}<small>초</small>`;
    l3 = '새해 첫 인사를 이 벽에 남겨 주세요';
  }
  const q = (queue.length + pendingList.length) / SIDES.length, eta = Math.max(1, Math.round((q * 11 + (reviewOff ? 20 : 50)) / 60));
  panels.forEach(p => { const e = p.el;
    e.querySelector('.hh').textContent = pad2(kst.getHours()); e.querySelector('.mm').textContent = pad2(kst.getMinutes());
    e.querySelector('.date').textContent = `${kst.getFullYear()}. ${pad2(kst.getMonth() + 1)}. ${pad2(kst.getDate())} ${days[kst.getDay()]}`;
    e.querySelector('.clkLabel').textContent = label; e.querySelector('.left1').textContent = l1; e.querySelector('.left2').innerHTML = l2; e.querySelector('.left3').textContent = l3;
    e.querySelector('.etaN').textContent = `약 ${eta}분`; });
}
setTimeout(() => { tickClock(); setInterval(tickClock, 500); panels.forEach(p => showScene(p, p.sc + 1)); }, 0);

// 한마디: 글자 수에 맞춰 크기 조절 (최대 2줄) + 글자별 애니메이션
function setMessage(p, text) {
  const w = p.msg; w.innerHTML = '';
  if (!text) return;
  // 단어는 줄바꿈 없이 묶고, 그 안에서 글자마다 따로 움직임
  let k = 0;
  text.split(' ').forEach((word, wi) => {
    if (wi) w.append(' ');
    const ws = document.createElement('span'); ws.style.whiteSpace = 'nowrap'; ws.style.display = 'inline-block';
    [...word].forEach(c => { const sp = document.createElement('span'); sp.className = 'c'; sp.style.setProperty('--i', k++); sp.style.setProperty('--rot', ((Math.random() - .5) * 14).toFixed(1) + 'deg'); sp.textContent = c; ws.append(sp); });
    w.append(ws);
  }); w.lastChild && w.lastChild.insertAdjacentHTML('beforeend', '<span class="c star" style="--i:' + k + ';--rot:0deg"></span>');
  let size = 150; w.style.fontSize = size + 'px';
  while (size > 70 && (w.scrollWidth > 960 || w.offsetHeight > size * 2 + 6)) { size -= 6; w.style.fontSize = size + 'px'; }
}
// 모인 빛: 한 편이 끝날 때마다 수평선 위에 빛이 하나씩 쌓임
function renderLights(newOne) {
  panels.forEach(p => {
    const box = p.el.querySelector('.lights');
    const show = Math.min(lights, 70);
    while (box.children.length > show) box.firstChild.remove();
    while (box.children.length < show) { const d = document.createElement('i'); d.style.left = (4 + Math.random() * 92) + '%'; d.style.bottom = (Math.random() * 46) + 'px';
      if (!newOne) d.style.animation = 'none'; box.append(d); }
    p.el.querySelector('.count b').textContent = String(lights).padStart(4, '0');
    p.el.querySelector('.horizon').style.setProperty('--glow', Math.min(1, lights / 300).toFixed(3));
  });
}
function addLight() { lights++; try { localStorage.setItem(LS_KEY, lights); } catch (e) {} renderLights(true); }
renderLights(false);

function fit() {
  const sc = Math.min(innerWidth / STAGE_W, innerHeight / PANEL_H);
  stage.style.transform = `translate(${(innerWidth - STAGE_W * sc) / 2}px, ${(innerHeight - PANEL_H * sc) / 2}px) scale(${sc})`;
}
addEventListener('resize', fit); fit();

// ===== 빛 입자 (천천히 떠오르는 빛 + 송출 시작 반짝임) =====
const fx = document.createElement('canvas');
fx.id = 'fx'; fx.width = STAGE_W; fx.height = PANEL_H; stage.appendChild(fx);
const ctx = fx.getContext('2d');
const dust = Array.from({ length: 90 }, () => ({
  x: Math.random() * STAGE_W, y: Math.random() * PANEL_H, r: (Math.random() * 4 + 2) * S,
  vy: -(Math.random() * .5 + .15) * S, ph: Math.random() * 6.28, c: Math.random() < .5 ? '22,115,255' : '25,195,255' }));
const sparks = [];
function burst(p) {
  const i = panels.indexOf(p), ox = i * PANEL_W, f = { x: ox + 22 * S, y: 22 * S, w: 1036 * S, h: 1876 * S };
  for (let k = 0; k < 200; k++) {
    const t = Math.random(), edge = k % 4;
    const x = edge === 0 ? f.x + t * f.w : edge === 1 ? f.x + f.w : edge === 2 ? f.x + t * f.w : f.x;
    const y = edge === 0 ? f.y : edge === 1 ? f.y + t * f.h : edge === 2 ? f.y + f.h : f.y + t * f.h;
    const a = Math.random() * 6.28, sp = (Math.random() * 7 + 2) * S;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: (Math.random() * 5 + 3) * S, c: Math.random() < .5 ? '22,115,255' : '57,184,255' });
  }
}
(function loop(t) {
  ctx.clearRect(0, 0, fx.width, fx.height);
  for (const d of dust) {
    d.y += d.vy; if (d.y < -10) { d.y = PANEL_H + 10; d.x = Math.random() * STAGE_W; }
    const a = .15 + .25 * (1 + Math.sin(t / 800 + d.ph)) / 2;
    ctx.fillStyle = `rgba(${d.c},${a})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.28); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vx *= .95; s.vy *= .95; s.life -= .014;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(${s.c},${s.life})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + s.life * .6), 0, 6.28); ctx.fill();
  }
  requestAnimationFrame(loop);
})(0);

// ===== 대기열 =====
// 검수 대기(pending) 단계부터 영상을 미리 받아두고, 승인(approved)되면 바로 재생
const queue = [];          // 승인된 항목 {id, message}
const seen = new Set();    // 큐에 넣었거나 송출한 id
const ready = new Map();   // id → objectURL (미리 받은 영상)
const loading = new Set();
let pendingList = [];      // 아직 검수 중인 항목 (미리 받기 대상)
let paused = false, played = 0, lastErr = '';
let reviewOff = false;     // 검수 OFF: 접수 즉시 송출 대기열로
const autoOk = new Set();

let polling = false, pollAgain = false;
async function poll() {
  if (paused) return;
  if (polling) { pollAgain = true; return; }
  polling = true;
  try {
    const items = await Relay.list('pending,approved');
    const active = new Set(items.map(x => x.id));
    for (const it of items) {
      if (it.status === 'pending' && reviewOff && !autoOk.has(it.id)) { autoOk.add(it.id); it.status = 'approved'; Relay.setStatus(it.id, 'approved').catch(() => autoOk.delete(it.id)); }
      if (it.status === 'approved' && !seen.has(it.id)) { seen.add(it.id); queue.push(it); }
    }
    pendingList = items.filter(x => x.status === 'pending');
    // 반려되었거나 사라진 항목의 미리 받은 영상은 즉시 폐기
    for (const [id, url] of ready) if (!active.has(id) && !queue.some(q => q.id === id)) { URL.revokeObjectURL(url); ready.delete(id); }
    lastErr = '';
  } catch (e) { lastErr = e.message; }
  polling = false;
  preload();
  schedule();
  if (pollAgain) { pollAgain = false; poll(); }
}

async function preload() {
  const targets = [...queue, ...pendingList].slice(0, PRELOAD);
  for (const it of targets) {
    if (ready.has(it.id) || loading.has(it.id)) continue;
    loading.add(it.id);
    Relay.getFile(it.id).then(blob => {
      ready.set(it.id, URL.createObjectURL(blob));
      schedule();
    }).catch(e => { // 파일이 없으면(이미 파기 등) 건너뜀
      const qi = queue.findIndex(q => q.id === it.id); if (qi >= 0) queue.splice(qi, 1);
      lastErr = e.message;
    }).finally(() => loading.delete(it.id));
  }
}

function schedule() {
  if (paused) return;
  for (const p of panels) {
    if (p.busy) continue;
    const it = queue.find(x => ready.has(x.id));
    if (!it) return;
    queue.splice(queue.indexOf(it), 1);
    play(p, it);
  }
}

function play(p, it) {
  p.busy = true; p.item = it; clearTimeout(p.scT);
  const url = ready.get(it.id); ready.delete(it.id);
  let count = 0;
  setMessage(p, it.message || '');
  const isPhoto = String(it.mime || '').startsWith('image');
  const goLive = () => { p.el.classList.add('live'); soften(p, 800); setTimeout(() => burst(p), 900); };
  let guard;
  if (isPhoto) { // 사진: 천천히 다가가는 연출로 일정 시간 표시
    p.el.classList.add('isPhoto');
    p.img.onload = () => { goLive(); clearTimeout(guard); guard = setTimeout(finish, PHOTO_MS); };
    p.img.onerror = () => finish();
    p.img.src = url;
    guard = setTimeout(finish, PHOTO_MS + 5000);
  } else {
    p.el.classList.remove('isPhoto');
    p.video.src = url;
    const start = () => p.video.play().catch(() => {});
    p.video.onloadeddata = () => { goLive(); start(); };
    p.video.onended = () => { count++; if (count < LOOPS) { p.video.currentTime = 0; start(); } else finish(); };
    guard = setTimeout(finish, 15000 * LOOPS); // 재생 오류 대비 안전장치
  }
  Relay.setStatus(it.id, 'playing', p.side).catch(() => {});
  let doneOnce = false;
  function finish() {
    if (doneOnce) return; doneOnce = true;
    clearTimeout(guard);
    p.el.classList.add('out'); p.el.classList.remove('soft');
    Relay.setStatus(it.id, 'played', p.side).catch(() => {}); // → 중간지점에서 즉시 파기
    played++;
    setTimeout(addLight, 900); // 도형이 빛 한 점으로 줄어 수평선에 합류
    setTimeout(() => {
      p.el.classList.remove('live', 'out', 'isPhoto'); replayIdleText(p);
      p.video.removeAttribute('src'); p.video.load(); p.img.removeAttribute('src');
      URL.revokeObjectURL(url);
      p.busy = false; p.item = null;
      schedule();
    }, 1300);
  }
  preload();
}

// ===== 단축키: F 전체화면 · D 상태표시 · P 일시정지(브랜딩 영상 구간 등) =====
const hud = document.getElementById('hud');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'd') hud.style.display = hud.style.display === 'block' ? 'none' : 'block';
  if (k === 'p') { paused = !paused; if (!paused) poll(); }
  if (k === 'r' && e.shiftKey) { lights = 0; try { localStorage.setItem(LS_KEY, 0); } catch (err) {} renderLights(false); } // Shift+R: 모인 빛 초기화
});
setInterval(() => {
  hud.textContent = `mode: ${Relay.mode}${paused ? '  [일시정지]' : ''}  lights: ${lights} (Shift+R 초기화)\nreview: ${reviewOff ? 'OFF(바로 송출)' : 'ON'}  queue: ${queue.length}  pending: ${pendingList.length}  ready: ${ready.size}  played: ${played}\n` +
    panels.map(p => `${p.side}: ${p.item ? '#' + p.item.id : '-'}`).join('  ') + (lastErr ? `\nerr: ${lastErr}` : '');
}, 500);

function applyReview(c) { const was = reviewOff; reviewOff = (c && c.review_mode) === 'off'; if (reviewOff && !was) poll(); checkReload(c); }
// 검수 콘솔의 「송출 화면 새로고침」: wall_reload 값이 바뀌면 재생 중이던 항목을 마무리(파기)하고 새로고침
let reloadMark, reloading = false;
async function checkReload(c) {
  const m = (c && c.wall_reload) || '';
  if (reloadMark === undefined) { reloadMark = m; return; }
  if (!m || m === reloadMark || reloading) return;
  reloading = true;
  await Promise.all(panels.filter(p => p.item).map(p => Relay.setStatus(p.item.id, 'played', p.side).catch(() => {})));
  location.reload();
}
Relay.getConfig && Relay.getConfig().then(applyReview).catch(() => {});
Relay.subscribeConfig && Relay.subscribeConfig(applyReview);
setInterval(() => Relay.getConfig && Relay.getConfig().then(applyReview).catch(() => {}), 15000);

document.fonts && document.fonts.load('100px NanumPen'); // 손글씨 폰트 미리 받기
poll();
const live = Relay.subscribe ? Relay.subscribe(poll) : false; // 실시간 알림 지원 시 즉시 반영
setInterval(poll, live ? 5000 : POLL_MS);
</script>
</body>
</html>
