<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>검수 콘솔 · 우리 새해 방명록</title>
<style>
  @font-face { font-family:"Wooridaum"; font-weight:700; src:url(assets/fonts/WooridaumB.woff2) format("woff2"); font-display:swap; }
  :root { --blue:#1673ff; --sky:#39b8ff; --cyan:#19c3ff; --ink:#0a1a33; --muted:#5a6b80; --line:#e3ebf4; --red:#ff4d5e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --spring:cubic-bezier(.68,-0.18,.22,1.18); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(180deg,#ffffff 0%,#f3f9ff 60%,#e6f1ff 100%) fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  .deco { position:fixed; left:-10vw; top:-62vw; width:120vw; height:80vw; border-radius:50%; pointer-events:none; z-index:0; opacity:.9;
    background: radial-gradient(60% 60% at 35% 70%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%), linear-gradient(135deg,#8fe6ff,#39b8ff 30%,#1673ff 65%,#0b5bd6);
    box-shadow:0 30px 120px rgba(22,115,255,.3); }
  header { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:14px; padding:18px 28px; color:#fff; }
  .pill { font-family:"Wooridaum",sans-serif; font-weight:700; font-size:14px; padding:7px 14px 8px; border-radius:999px; border:1.5px solid #fff; }
  header h1 { font-family:"Wooridaum",sans-serif; font-size:24px; margin:0 8px 0 4px; letter-spacing:-.02em; }
  .stat { display:flex; align-items:baseline; gap:8px; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.18); backdrop-filter:blur(10px); font-size:13px; }
  .stat b { font:700 20px/1 var(--mono); }
  .mode { font:600 11px/1 var(--mono); letter-spacing:.12em; opacity:.8; }
  .help { margin-left:auto; font-size:13px; padding:8px 14px; border-radius:999px; background:rgba(10,26,51,.55); backdrop-filter:blur(10px); }
  kbd { font:700 12px/1 var(--mono); background:#fff; color:var(--blue); border-radius:6px; padding:4px 7px; margin:0 2px; }
  main { position:relative; z-index:1; padding:26px 28px 40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:18px; }
  .card { position:relative; background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 0 0 1px var(--line), 0 14px 40px rgba(22,115,255,.12);
    animation: cIn .5s var(--spring); transition: transform .35s cubic-bezier(.6,0,.3,1), opacity .35s, box-shadow .3s; }
  @keyframes cIn { from { transform:scale(.85) translateY(20px); opacity:0; } }
  .card.focus { box-shadow:0 0 0 3px var(--blue), 0 18px 50px rgba(22,115,255,.3); }
  .card.focus::before { content:"NEXT"; position:absolute; z-index:2; left:12px; top:12px; font:700 11px/1 var(--mono); letter-spacing:.14em; color:#fff;
    background:linear-gradient(135deg,#39b8ff,#1673ff); padding:6px 9px; border-radius:999px; }
  .card.ok-out { transform:translateY(-40px) scale(.9); opacity:0; }
  .card.no-out { transform:scale(.8) rotate(-4deg); opacity:0; }
  .card .media { width:100%; aspect-ratio:9/16; object-fit:cover; background:#0a1a33; display:block; transform:scaleX(-1); }
  .kind { position:absolute; right:12px; top:12px; z-index:2; font:700 10px/1 var(--mono); letter-spacing:.12em; color:#fff; background:rgba(10,26,51,.55); padding:6px 8px; border-radius:999px; backdrop-filter:blur(8px); }
  .mswitch { display:flex; align-items:center; gap:10px; border:0; cursor:pointer; padding:8px 8px 8px 14px; border-radius:999px; background:rgba(255,255,255,.18); color:#fff; font-size:13px; font-weight:700; backdrop-filter:blur(10px); }
  .mswitch .tg { position:relative; width:42px; height:24px; border-radius:999px; background:rgba(255,255,255,.35); transition:background .3s; }
  .mswitch .tg::after { content:""; position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .35s var(--spring); }
  .mswitch.on { background:#fff; color:var(--blue); box-shadow:0 8px 24px rgba(10,26,51,.25); }
  .mswitch.on .tg { background:linear-gradient(135deg,#39b8ff,#1673ff); }
  .mswitch.on .tg::after { transform:translateX(18px); }
  .meta { padding:12px 14px 6px; }
  .msg { font-family:"Wooridaum",sans-serif; font-size:17px; font-weight:700; min-height:22px; letter-spacing:-.01em; }
  .time { font:500 11px/1.4 var(--mono); color:var(--muted); margin-top:5px; letter-spacing:.04em; }
  .acts { display:flex; gap:8px; padding:8px 14px 14px; }
  .acts button { flex:1; border:0; border-radius:999px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; transition:transform .15s; }
  .acts button:active { transform:scale(.95); }
  .ok { color:#fff; background:linear-gradient(135deg,#39b8ff,#1673ff 60%); box-shadow:0 8px 20px rgba(22,115,255,.3); }
  .no { color:var(--red); background:#fff; box-shadow:0 0 0 1.5px rgba(255,77,94,.5) inset; }
  .empty { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; gap:18px; padding:110px 0; color:var(--muted); font-size:16px; }
  .empty i { width:90px; height:90px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff 0, #c9f4ff 30%, #39b8ff 70%, #1673ff 100%);
    box-shadow:0 20px 60px rgba(22,115,255,.35); animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:scale(.9); } }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:9; background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<div class="deco"></div>
<header>
  <span class="pill">「우리 새해 방명록」</span>
  <h1>검수 콘솔</h1>
  <span class="stat">검수 대기<b id="n-pending">0</b></span>
  <span class="stat">송출 대기<b id="n-approved">0</b></span>
  <button class="mswitch" id="mswitch" title="네트워크가 혼잡할 때 모든 폰을 사진 모드로만 촬영하게 합니다"><span id="mlabel">사진 전용 모드 OFF</span><span class="tg"></span></button>
  <span class="mode" id="mode"></span>
  <span class="help">NEXT 카드: <kbd>A</kbd> 승인 · <kbd>R</kbd> 반려(즉시 파기)</span>
</header>
<main id="list"><div class="empty"><i></i>검수 대기 중인 영상이 없어요</div></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ENDPOINT = ''; // ← Apps Script 웹 앱 URL (비워두면 로컬 데모 모드)
const SB_URL = 'https://jmsnadveqmduzprrevlb.supabase.co';  // Supabase 프로젝트 URL
const SB_KEY = 'sb_publishable_5tBAE0E6yw9PGkGmeXj0Yw_LMEVIMPw';  // 공개용(publishable) 키 — RLS로 보호되므로 코드에 넣어도 됨
// ===== 중간지점(Relay) 연결 — 세 파일 공통 =====
// ENDPOINT가 비어 있으면 '로컬 데모 모드'(같은 PC 같은 브라우저의 탭끼리 IndexedDB로 주고받음)
// 우선순위: ?api=(Apps Script) → Supabase(SB_URL·SB_KEY 설정 시) → 로컬 데모(localhost 또는 ?local)
const QS = new URLSearchParams(location.search);
const API = QS.get('api') || ENDPOINT;
const STAFF_KEY = QS.get('key') || '';   // 콘솔·송출 PC 전용 (승인·반려·송출 권한)
const LOCAL_OK = QS.has('local') || location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
const USE_SB = !API && !QS.has('local') && typeof SB_URL !== 'undefined' && SB_URL && SB_KEY && window.supabase;
const Relay = API ? gasRelay(API) : USE_SB ? supabaseRelay(SB_URL, SB_KEY, STAFF_KEY) : (LOCAL_OK ? localRelay() : null);
const RELAY_KEY = API || (USE_SB ? SB_URL : 'local'); // 접수 기록이 어느 중간지점 것인지 구분

function supabaseRelay(url, key, staffKey) {
  const sb = window.supabase.createClient(url, key, { auth: { persistSession: false } });
  const BUCKET = 'guestbook';
  const paths = new Map(); // id → 저장소 경로 (목록 조회 때 기억)
  const toItem = (r) => ({ id: r.id, createdAt: Date.parse(r.created_at), status: r.status, mime: r.mime,
    message: r.message || '', side: r.side || '' });
  const fail = (e, fallback) => { throw new Error((e && e.message) || fallback || '요청 실패'); };
  return {
    mode: 'supabase',
    async upload(blob, mime, message) {
      const ext = mimeExt(mime);
      const path = (mime.startsWith('image') ? 'p/' : 'v/') + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + ext;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: mime, upsert: false });
      if (up.error) fail(up.error, '업로드 실패');
      const ins = await sb.from('guestbook').insert({ path, mime, message: String(message || '').slice(0, 20) }).select('id').single();
      if (ins.error) { sb.storage.from(BUCKET).remove([path]); fail(ins.error, '접수 실패'); }
      return { ok: true, id: ins.data.id };
    },
    async list(status) {
      let q = sb.from('guestbook').select('*').order('created_at');
      if (status) q = q.in('status', String(status).split(','));
      const { data, error } = await q;
      if (error) fail(error);
      data.forEach(r => { if (r.path) paths.set(r.id, r.path); });
      return data.map(toItem);
    },
    async getFile(id) {
      let path = paths.get(id);
      if (!path) {
        const { data } = await sb.from('guestbook').select('path').eq('id', id).maybeSingle();
        path = data && data.path;
      }
      if (!path) throw new Error('파일 없음(이미 파기됨)');
      const r = await fetch(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl, { cache: 'no-store' });
      if (!r.ok) throw new Error('파일 없음(이미 파기됨)');
      return r.blob();
    },
    async setStatus(id, status, side = '') {
      const { data, error } = await sb.rpc('staff_set_status', { p_key: staffKey, p_id: id, p_status: status, p_side: side });
      if (error) fail(error);
      if (data) { paths.delete(id); await sb.storage.from(BUCKET).remove([data]); } // 즉시 파기
      return { ok: true };
    },
    async status(id) {
      const { data, error } = await sb.from('guestbook').select('id,status,side,created_at').eq('id', id).maybeSingle();
      if (error) fail(error);
      if (!data) throw new Error('없음');
      let position = 0;
      if (data.status === 'approved') {
        const c = await sb.from('guestbook').select('id', { count: 'exact', head: true })
          .eq('status', 'approved').lt('created_at', data.created_at);
        position = (c.count || 0) + 1;
      }
      return { ok: true, status: data.status, position, side: data.side };
    },
    // 운영 설정 (capture_mode: both | photo)
    async getConfig() {
      const { data, error } = await sb.from('app_config').select('k,v');
      if (error) return { ...DEFAULT_CONFIG };
      return Object.assign({ ...DEFAULT_CONFIG }, Object.fromEntries(data.map(r => [r.k, r.v])));
    },
    async setConfig(k, v) {
      const { error } = await sb.rpc('staff_set_config', { p_key: staffKey, p_k: k, p_v: v });
      if (error) fail(error);
      return { ok: true };
    },
    subscribeConfig(cb) {
      sb.channel('config-' + Math.random().toString(36).slice(2))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'app_config' }, () => this.getConfig().then(cb))
        .subscribe();
      return true;
    },
    // 새 접수·상태 변경이 생기면 즉시 호출 (폴링 대신)
    subscribe(cb) {
      sb.channel('guestbook-' + Math.random().toString(36).slice(2))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, () => cb())
        .subscribe();
      return true;
    },
  };
}

function gasRelay(url) {
  const timeoutFetch = (u, opt = {}, ms = 60000) => {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), ms);
    return fetch(u, { ...opt, signal: ac.signal }).finally(() => clearTimeout(t));
  };
  const get = async (params) => {
    const r = await timeoutFetch(url + '?' + new URLSearchParams(params));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '요청 실패');
    return j;
  };
  // Content-Type text/plain = 사전요청(preflight) 없는 단순 요청 → Apps Script와 호환
  const post = async (body) => {
    const r = await timeoutFetch(url, { method: 'POST', body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '요청 실패');
    return j;
  };
  return {
    mode: 'apps-script',
    async upload(blob, mime, message) {
      const data = await blobToBase64(blob);
      return post({ action: 'upload', mime, message, data });
    },
    async list(status) { return (await get({ action: 'list', status })).items; },
    async getFile(id) {
      const j = await get({ action: 'file', id });
      return (await fetch(`data:${j.mime};base64,${j.data}`)).blob();
    },
    setStatus(id, status, side = '') { return post({ action: 'setStatus', id, status, side }); },
    status(id) { return get({ action: 'status', id }); },
    async getConfig() { return { ...DEFAULT_CONFIG }; },
    async setConfig() { throw new Error('Apps Script 모드에서는 사진 전용 전환을 지원하지 않아요'); },
  };
}

function localRelay() {
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open('woori-guestbook-demo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const store = async (mode) => (await dbp).transaction('items', mode).objectStore('items');
  const all = async () => rq((await store('readonly')).getAll());
  return {
    mode: 'local',
    async upload(blob, mime, message) {
      const id = Math.random().toString(36).slice(2, 10);
      const now = Date.now();
      await rq((await store('readwrite')).put({ id, createdAt: now, status: 'pending', blob, mime, message: String(message || '').slice(0, 20), side: '', updatedAt: now }));
      return { ok: true, id };
    },
    async list(status) {
      return (await all()).filter(x => !status || String(status).split(',').includes(x.status))
        .sort((a, b) => a.createdAt - b.createdAt)
        .map(({ blob, ...rest }) => rest);
    },
    async getFile(id) {
      const it = await rq((await store('readonly')).get(id));
      if (!it || !it.blob) throw new Error('파일 없음(이미 파기됨)');
      return it.blob;
    },
    async setStatus(id, status, side = '') {
      const it = await rq((await store('readonly')).get(id));
      if (!it) return { ok: false };
      it.status = status; it.updatedAt = Date.now();
      if (side) it.side = side;
      if (status === 'rejected' || status === 'played') { delete it.blob; it.message = ''; } // 즉시 파기
      await rq((await store('readwrite')).put(it));
      return { ok: true };
    },
    async status(id) {
      const items = await all();
      const me = items.find(x => x.id === id);
      if (!me) throw new Error('없음');
      const position = me.status === 'approved'
        ? items.filter(x => x.status === 'approved' && x.createdAt < me.createdAt).length + 1 : 0;
      return { ok: true, status: me.status, position, side: me.side };
    },
    async getConfig() { try { return Object.assign({ ...DEFAULT_CONFIG }, JSON.parse(localStorage.getItem('woori-gb-config') || '{}')); } catch (e) { return { ...DEFAULT_CONFIG }; } },
    async setConfig(k, v) { const c = await this.getConfig(); c[k] = v; localStorage.setItem('woori-gb-config', JSON.stringify(c)); return { ok: true }; },
    subscribeConfig(cb) { addEventListener('storage', (e) => { if (e.key === 'woori-gb-config') this.getConfig().then(cb); }); return true; },
  };
}

const DEFAULT_CONFIG = { capture_mode: 'both' };
function mimeExt(m) { return m.includes('mp4') ? 'mp4' : m.includes('webm') ? 'webm' : m.includes('png') ? 'png' : m.includes('webp') ? 'webp' : m.includes('jpeg') || m.includes('jpg') ? 'jpg' : 'bin'; }

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}


if (!Relay) { document.body.innerHTML = '<p style="color:#fff;font:20px sans-serif;padding:40px">연결 정보가 없어요. 주소 뒤에 ?api=웹앱URL 을 붙여 열어주세요. (같은 PC 테스트는 ?local)</p>'; throw new Error('no relay'); }
const list = document.getElementById('list');
document.getElementById('mode').textContent = { local: '로컬 데모 모드', 'apps-script': 'Apps Script 연결', supabase: 'Supabase 연결' }[Relay.mode];
const cards = new Map(); // id → {el, url}
let busy = false, again = false;

async function refresh() {
  if (busy) { again = true; return; }
  busy = true;
  try {
    const items = await Relay.list('pending,approved');
    const pending = items.filter(x => x.status === 'pending'), approved = items.filter(x => x.status === 'approved');
    document.getElementById('n-pending').textContent = pending.length;
    document.getElementById('n-approved').textContent = approved.length;
    const ids = new Set(pending.map(p => p.id));
    for (const [id, c] of cards) if (!ids.has(id)) removeCard(id);
    for (const p of pending) if (!cards.has(p.id)) addCard(p);
    updateFocus();
  } catch (e) { console.warn(e); }
  busy = false;
  if (again) { again = false; refresh(); }
}

function addCard(p) {
  list.querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.className = 'card';
  const isPhoto = String(p.mime || '').startsWith('image');
  el.innerHTML = `${isPhoto ? '<img class="media" alt=""><span class="kind">PHOTO</span>' : '<video class="media" muted loop playsinline autoplay></video><span class="kind">VIDEO 5s</span>'}
    <div class="meta"><div class="msg"></div><div class="time">${new Date(p.createdAt).toLocaleTimeString('ko-KR')} · #${p.id}</div></div>
    <div class="acts"><button class="ok">승인</button><button class="no">반려</button></div>`;
  el.querySelector('.msg').textContent = p.message || '(문구 없음)';
  el.querySelector('.ok').onclick = () => decide(p.id, 'approved');
  el.querySelector('.no').onclick = () => decide(p.id, 'rejected');
  list.appendChild(el);
  const c = { el, url: '' };
  cards.set(p.id, c);
  Relay.getFile(p.id).then(blob => {
    c.url = URL.createObjectURL(blob);
    el.querySelector('.media').src = c.url;
  }).catch(() => { el.querySelector('.time').textContent += ' · 영상 불러오기 실패'; });
}
function removeCard(id) {
  const c = cards.get(id); if (!c) return;
  if (c.url) URL.revokeObjectURL(c.url);
  c.el.remove(); cards.delete(id);
  if (!cards.size) list.innerHTML = '<div class="empty"><i></i>검수 대기 중인 영상이 없어요</div>';
}
function updateFocus() {
  let first = true;
  for (const c of cards.values()) { if (c.leaving) continue; c.el.classList.toggle('focus', first); first = false; }
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
async function decide(id, status) {
  const c = cards.get(id); if (!c || c.leaving) return;
  c.leaving = true; c.el.classList.add(status === 'approved' ? 'ok-out' : 'no-out');
  setTimeout(() => { removeCard(id); updateFocus(); }, 350);
  try { await Relay.setStatus(id, status); toast(status === 'approved' ? '승인 — 송출 대기열에 올렸어요' : '반려 — 영상을 바로 파기했어요'); }
  catch (e) { toast('처리 실패: ' + e.message); }
  refresh();
}
document.addEventListener('keydown', e => {
  const first = [...cards].find(([, c]) => !c.leaving)?.[0];
  if (!first) return;
  if (e.key === 'a' || e.key === 'A') decide(first, 'approved');
  if (e.key === 'r' || e.key === 'R') decide(first, 'rejected');
});

// ---- 사진 전용 모드 (모든 폰 접속에 적용)
let capMode = 'both';
function renderMode(cfg) {
  capMode = (cfg && cfg.capture_mode) || 'both';
  const on = capMode === 'photo';
  document.getElementById('mswitch').classList.toggle('on', on);
  document.getElementById('mlabel').textContent = on ? '사진 전용 모드 ON' : '사진 전용 모드 OFF';
}
document.getElementById('mswitch').onclick = async () => {
  const next = capMode === 'photo' ? 'both' : 'photo';
  try { await Relay.setConfig('capture_mode', next); renderMode({ capture_mode: next });
    toast(next === 'photo' ? '모든 폰이 사진 모드로만 촬영해요' : '영상·사진 모두 촬영할 수 있어요'); }
  catch (e) { toast('전환 실패: ' + e.message + (STAFF_KEY ? '' : ' (주소에 ?key= 필요)')); }
};
Relay.getConfig && Relay.getConfig().then(renderMode);
Relay.subscribeConfig && Relay.subscribeConfig(renderMode);

refresh();
const live = Relay.subscribe ? Relay.subscribe(refresh) : false; // 실시간 알림 지원 시 즉시 갱신
setInterval(refresh, live ? 5000 : 1500);
</script>
</body>
